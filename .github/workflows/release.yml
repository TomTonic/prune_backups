name: Build and Release Go Executables

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

permissions:
  contents: read

jobs:
  build:
    name: Build and Release
    permissions:
      contents: write # needed to create the release and upload its assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history to build the changelog, and the
          # tags for the version. It also matters for the binary itself: the
          # version printed by `prune_backups version` comes from
          # debug.ReadBuildInfo(), which the Go toolchain fills in from the
          # VCS state of the checkout.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # GoReleaser cross-compiles every target, builds the deb/rpm/apk/
      # pacman packages, and pushes the Homebrew cask - all from
      # .goreleaser.yml. CGO_ENABLED=0 is set there per build, and it is
      # required rather than cosmetic: GOARCH=amd64 on an amd64 runner is not
      # a cross-compile, so cgo would stay enabled and the linux/amd64 binary
      # would come out dynamically linked against the runner's glibc, while
      # every other target cross-compiles and is static. That asymmetry
      # breaks the premise these packages are built on ("one package per
      # architecture works on every distro"): the amd64 build then cannot run
      # on musl distros at all, and fails on any distro whose glibc is older
      # than the runner's.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A deploy key, not a PAT: write-scoped to exactly the one
          # repository GoReleaser pushes to (the Homebrew tap), and revocable
          # on its own.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
