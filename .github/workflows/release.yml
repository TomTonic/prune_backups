name: Build and Release Go Executables

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

permissions:
  contents: read

jobs:
  build:
    name: Build and Release
    # Declare default permissions as write to be allowed to publich artifacts.
    permissions:
      contents: write
    runs-on: ubuntu-latest
#    strategy:
#      matrix:
#        goos: [linux, windows, darwin]
#        goarch: [amd64, arm64]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Executable
        # CGO_ENABLED=0 is required, not cosmetic: GOARCH=amd64 on an amd64
        # runner is not a cross-compile, so cgo stays enabled by default and
        # the linux/amd64 binary comes out dynamically linked against the
        # runner's glibc - while every other target cross-compiles and is
        # static. That asymmetry breaks the premise these packages are built
        # on ("one package per architecture works on every distro"): the
        # amd64 build then cannot run on musl distros at all, and fails on
        # any distro whose glibc is older than the runner's.
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/prune_backups-amd64-linux .
          GOOS=linux GOARCH=arm64 go build -o dist/prune_backups-arm64-linux .
          GOOS=linux GOARCH=386 go build -o dist/prune_backups-x86-linux .
          GOOS=linux GOARCH=arm go build -o dist/prune_backups-arm-linux .
          GOOS=windows GOARCH=amd64 go build -o dist/prune_backups-amd64-win.exe .
          GOOS=windows GOARCH=arm64 go build -o dist/prune_backups-arm64-win.exe .
          GOOS=windows GOARCH=386 go build -o dist/prune_backups-x86-win.exe .
          GOOS=darwin GOARCH=amd64 go build -o dist/prune_backups-amd64-mac .
          GOOS=darwin GOARCH=arm64 go build -o dist/prune_backups-arm64-mac .

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      # Builds .deb, .rpm, .apk and .pkg.tar.zst packages from the shared
      # nfpm.yaml spec, so this single config covers Debian/Ubuntu (and
      # derivatives like Mint, Pop!_OS, Raspberry Pi OS), Fedora/RHEL/CentOS/
      # Rocky/Alma/openSUSE, Alpine, and Arch Linux. The binary itself is a
      # static, CGO-free Go build, so one package per architecture works
      # across all distro versions supported by the target Go release -
      # there is no need for per-distro-version builds.
      - name: Build Linux Packages (deb, rpm, apk, pacman)
        env:
          NFPM_VERSION: ${{ github.ref_name }}
        run: |
          NFPM_VERSION=${NFPM_VERSION#v}
          for arch in amd64 arm64; do
            export NFPM_ARCH=$arch
            export NFPM_VERSION
            export NFPM_BIN=dist/prune_backups-${arch}-linux
            for pkg in deb rpm apk archlinux; do
              nfpm package --config nfpm.yaml --packager "$pkg" --target dist/
            done
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/prune_backups-*
            dist/prune_backups_*
