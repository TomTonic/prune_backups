name: prune_backups
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: admin
priority: optional
maintainer: Tom Tonic <tom@tomtonic.de>
description: |
  Prune (cull, weed, thin) incremental backup directories created with
  rsync or similar tools, keeping one snapshot per hour for a day, one
  per day for a month, and one per month thereafter.
vendor: TomTonic
homepage: https://github.com/TomTonic/prune_backups
license: MIT
contents:
  - src: ${NFPM_BIN}
    dst: /usr/bin/prune_backups
    expand: true
    file_info:
      mode: 0755
  - src: ./README.md
    dst: /usr/share/doc/prune_backups/README.md
  - src: ./LICENSE
    dst: /usr/share/doc/prune_backups/LICENSE
